<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lihat selengkapnya</title>
    
    <!-- Twitter Card Meta Tags (Disesuaikan untuk rasio portrait/vertical) -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="Rekomendasi Produk Terbaik Hari Ini">
    <meta name="twitter:description" content="Klik video untuk melihat detail dan membeli produk di Shopee.">
    <!-- Ganti URL di bawah dengan link GitHub Pages Anda nanti -->
    <meta name="twitter:player" content="https://USERNAME_GITHUB_ANDA.github.io/NAMA_REPOSITORI_ANDA/">
    <meta name="twitter:player:width" content="720">
    <meta name="twitter:player:height" content="1280">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111; /* Latar belakang gelap jika ada sisa ruang */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }
        video {
            width: 100%;
            height: 100%;
            /* Menggunakan 'contain' agar seluruh isi video portrait terlihat utuh tanpa terpotong */
            object-fit: contain;
        }
        /* Petunjuk visual di bawah */
        .click-overlay {
            position: absolute;
            bottom: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <!-- Memutar video portrait video2.mp4 -->
    <video id="promoVideo" autoplay muted loop playsinline>
        <source src="video2.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
    </video>

    <div class="click-overlay">🔍 Ketuk untuk lihat </div>

    <script>
        // Mengarahkan pengguna langsung ke Shopee Affiliate saat video diklik
        document.body.addEventListener('click', function() {
            window.location.href = 'https://s.shopee.co.id/1LfxHP1Rzg';
        });
    </script>

</body>
</html>
